apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-tools
spec:
  replicas: 1
  # SQLite on a single RWO volume: one writer at a time, so replace the pod instead of overlapping.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: internal-tools
  template:
    metadata:
      labels:
        app: internal-tools
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: app
          image: internal-tools:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_PATH
              value: /data/data.db
          envFrom:
            - configMapRef:
                name: internal-tools-config
            - secretRef:
                name: internal-tools-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/users
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/users
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: internal-tools-data
