# Feature flags only: image internal-tools-flags:dev, its own Deployment/Service/PVC, NodePort 30083.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
nameSuffix: -flags
labels:
  - pairs:
      app.kubernetes.io/instance: flags
    includeSelectors: true
images:
  - name: internal-tools
    newName: internal-tools-flags
    newTag: dev
patches:
  - target:
      kind: ConfigMap
      name: internal-tools-config
    patch: |
      - op: add
        path: /data/TOOLS
        value: "flags"
  - target:
      kind: Service
      name: internal-tools
    patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30083
